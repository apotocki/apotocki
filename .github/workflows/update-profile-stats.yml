name: Update profile statistics

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/scripts/update-profile-stats.mjs'
      - '.github/scripts/update-profile-stats.test.mjs'
      - '.github/workflows/update-profile-stats.yml'

permissions:
  contents: write

concurrency:
  group: profile-statistics
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test statistics updater
        run: node --test .github/scripts/update-profile-stats.test.mjs
      - name: Fetch and render statistics
        run: node .github/scripts/update-profile-stats.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit updated statistics
        run: |
          if git diff --quiet -- assets/profile-stats.svg; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/profile-stats.svg
          git commit -m "Update profile statistics"
          git push
